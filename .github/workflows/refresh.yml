name: Refresh match data

on:
  schedule:
    - cron: "0 1,13 * * *"
  # 改动抓取脚本或本文件时顺手重建一次数据；
  # 刻意排除 data/matches.json，避免 workflow 自己的 commit 触发循环。
  push:
    branches: ["main"]
    paths:
      - "scripts/build_data.py"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:
    inputs:
      areas:
        description: NOW TV areas (england,ucl,spain,uel,uecl,local,otherSoccer,worldcup2026)
        default: "england,ucl"
      limit:
        description: max matches to publish
        default: "12"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Rebuild data/matches.json
        run: |
          set +e
          python3 scripts/build_data.py \
            --areas "${{ github.event.inputs.areas || 'england,ucl' }}" \
            --limit "${{ github.event.inputs.limit || '12' }}"
          code=$?
          # 1 = nothing fetched, keep the previous data file
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "chore: refresh match data"
          git push
